  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

<body>

  <header class="gallery-header">
    <a class="gallery-back-btn" href="/"><i class="fas fa-arrow-left"></i> Back to App</a>
  </header>

  <div class="gallery-hero">
    <h1>Moments and Memories from the Senior Victorian Championship: A Story in Pictures</h1>
    <p>Hover over any photo to see it in full colour. Click to open.</p>
    <button class="btn-slideshow" id="btn-play">
      <i class="fas fa-play"></i> Play Slideshow
    </button>
  </div>

  <div class="gallery-grid" id="gallery-grid">
    <p class="gallery-loading"><i class="fas fa-spinner fa-spin"></i> Loading photos&hellip;</p>
  </div>

  <!-- ── Lightbox Modal ── -->
  <div id="lightbox" class="modal" role="dialog" aria-modal="true" aria-label="Photo viewer" aria-hidden="true">
    <div class="modal-overlay" id="lightbox-overlay"></div>
    <div class="lightbox-container">
      <div class="lightbox-controls">
        <a id="lb-download" class="lb-btn" title="Download photo" aria-label="Download photo">
          <i class="fas fa-download"></i>
        </a>
        <button id="lb-copy" class="lb-btn" title="Copy link to photo" aria-label="Copy link">
          <i class="fas fa-link"></i>
        </button>
        <button id="lb-close" class="lb-btn" title="Close" aria-label="Close">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="lightbox-img-wrap">
        <img id="lb-img" src="" alt="" />
        <img id="lb-watermark" class="watermark" src="watermark.png" alt="" aria-hidden="true"
             onerror="this.style.display='none'" />
      </div>
      <button class="lb-arrow lb-prev" id="lb-prev" aria-label="Previous photo">
        <i class="fas fa-chevron-left"></i>
      </button>
      <button class="lb-arrow lb-next" id="lb-next" aria-label="Next photo">
        <i class="fas fa-chevron-right"></i>
      </button>
    </div>
  </div>

  <!-- ── Slideshow Modal ── -->
  <div id="slideshow" class="modal" role="dialog" aria-modal="true" aria-label="Slideshow" aria-hidden="true">
    <div class="ss-img-wrap">
      <img id="ss-img-a" class="ss-img" src="" alt="" />
      <img id="ss-img-b" class="ss-img" src="" alt="" />
    </div>
    <div class="ss-controls-top">
      <button id="ss-play-pause" class="lb-btn" title="Pause" aria-label="Pause slideshow">
        <i class="fas fa-pause"></i>
      </button>
      <button id="ss-close" class="lb-btn" title="Close slideshow" aria-label="Close slideshow">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div class="ss-counter" id="ss-counter" aria-live="polite"></div>
    <audio id="ss-audio" loop preload="none">
      <source src="audio/slideshow.mp3" type="audio/mpeg" />
    </audio>
  </div>

  <!-- ── Toast notification ── -->
  <div id="lb-toast" class="toast" role="status" aria-live="polite"></div>

  <script src="gallery.js"></script>
<script src="/assets/nav.js" defer></script>
</body>
</html>
