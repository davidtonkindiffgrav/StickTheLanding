  <style>
    body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; margin: 0; }
    .lib-header {
      background: var(--header-bg); padding: 18px 32px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .lib-header-title { font-size: 1.4rem; font-weight: 700; color: var(--text); text-decoration: none; letter-spacing: -0.02em; }
    .lib-header-title span { color: var(--accent); }
    .lib-back-btn { color: var(--muted); text-decoration: none; font-size: 0.875rem; display: flex; align-items: center; gap: 6px; transition: color 0.2s; }
    .lib-back-btn:hover { color: var(--text); }

    .lib-main { max-width: 1100px; margin: 0 auto; padding: 48px 32px 64px; }
    .lib-main h1 { font-size: clamp(1.6rem, 3vw, 2.2rem); font-weight: 800; letter-spacing: -0.02em; margin-bottom: 8px; }
    .lib-tagline { color: var(--muted); font-size: 0.9rem; margin-bottom: 40px; }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }
    .gallery-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      text-decoration: none;
      color: var(--text);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }
    .gallery-card:hover { transform: translateY(-3px); border-color: var(--accent); }
    .gallery-card-hero {
      width: 100%; aspect-ratio: 16/9;
      object-fit: cover;
      display: block;
      filter: grayscale(0.2);
      transition: filter 0.3s;
    }
    .gallery-card:hover .gallery-card-hero { filter: grayscale(0); }
    .gallery-card-body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .gallery-card-label {
      font: 700 10px/1 'JetBrains Mono', monospace;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 2px;
    }
    .gallery-card-title { font-size: 1rem; font-weight: 700; line-height: 1.3; }
    .gallery-card-meta { color: var(--muted); font-size: 0.82rem; display: flex; gap: 12px; margin-top: 2px; }
    .gallery-card-cta {
      margin-top: auto; padding-top: 14px;
      font-size: 0.85rem; font-weight: 600; color: var(--accent);
    }

    @media (max-width: 600px) {
      .lib-header { padding: 14px 16px; }
      .lib-main { padding: 32px 16px 48px; }
    }
  </style>

    <p class="lib-tagline">Competition galleries from the Victorian gymnastics season.</p>

    <div class="gallery-grid">

        <img class="gallery-card-hero"
             src="/galleries/senior-vic-champs-2026/og-image.jpg"
             alt="Senior Victorian Championship 2026" loading="lazy" />
        <div class="gallery-card-body">
          <div class="gallery-card-label">WAG &amp; MAG · May 2026</div>
          <div class="gallery-card-title">Senior Victorian Championship</div>

        </div>
      </a>
