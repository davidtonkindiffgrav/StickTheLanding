<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="A gymnast silhouette leaping beside a film clapperboard, on a cinema-style gradient background">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e" />
      <stop offset="45%" stop-color="#4b3f9e" />
      <stop offset="75%" stop-color="#7c6dfa" />
      <stop offset="100%" stop-color="#fa6d9a" />
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="480" fill="url(#bg)" />
  <rect x="0" y="0" width="1200" height="480" fill="url(#spot)" />

  <!-- filmstrip borders -->
  <g fill="#0f0f13" opacity="0.55">
    <rect x="0" y="0" width="1200" height="34" />
    <rect x="0" y="446" width="1200" height="34" />
  </g>
  <g fill="#f4f4f8" opacity="0.85">
