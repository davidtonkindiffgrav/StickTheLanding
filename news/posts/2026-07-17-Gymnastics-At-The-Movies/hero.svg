  <!-- clapperboard -->
  <g transform="translate(190,175)">
    <rect x="0" y="46" width="230" height="150" rx="10" fill="#16161f" opacity="0.9" />
    <g>
      <rect x="-6" y="0" width="242" height="52" rx="8" fill="#f4f4f8" transform="skewX(-18)" opacity="0.95" />
