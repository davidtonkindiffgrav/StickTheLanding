  <!-- scattered stars -->
  <g fill="#ffffff" opacity="0.5">
    <path d="M180 100 l6 15 16 2 -12 11 4 16 -14 -9 -14 9 4 -16 -12 -11 16 -2 z" />
    <path d="M1020 360 l5 12 13 2 -10 9 3 13 -11 -7 -11 7 3 -13 -10 -9 13 -2 z" />
    <path d="M940 90 l4 10 11 1 -8 8 2 11 -9 -6 -9 6 2 -11 -8 -8 11 -1 z" />
