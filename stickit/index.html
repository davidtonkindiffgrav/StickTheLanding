<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stick It! — Stick The Landing</title>
    <meta name="description" content="Play Stick It! — a gymnastics game from Stick The Landing." />
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="Stick The Landing" />
    <meta property="og:title"       content="Stick It!" />
    <meta property="og:description" content="Play Stick It! — a gymnastics game from Stick The Landing." />
    <meta property="og:url"         content="https://stickthelanding.com.au/stickit/" />
    <meta property="og:image"       content="https://stickthelanding.com.au/assets/images/stickit_playnow.jpg" />
    <meta name="twitter:card"       content="summary_large_image" />
    <link rel="canonical"           href="https://stickthelanding.com.au/stickit/" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicons/favicon-16x16.png" />
    <link rel="manifest" href="/assets/favicons/site.webmanifest" />
    <link rel="shortcut icon" href="/assets/favicons/favicon.ico" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/assets/style.css" />
    <link rel="stylesheet" href="/news/assets/blog.css" />
    <style>
      #portrait-blocker {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: #231F20;
        color: #fff;
        z-index: 9999;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        text-align: center;
        font-family: sans-serif;
        gap: 12px;
      }
      #portrait-blocker .icon { font-size: 52px; line-height: 1; }
      #portrait-blocker .label { font-size: 18px; margin: 0; opacity: 0.75; }
      @media (orientation: portrait) { #portrait-blocker { display: flex; } }

      /* On touch devices: canvas goes fullscreen and header is hidden */
      @media (hover: none) and (pointer: coarse) {
        #unity-canvas {
          position: fixed !important;
          top: 0 !important;
          left: 0 !important;
          width: 100% !important;
          height: 100% !important;
          touch-action: none;
          z-index: 10;
        }
        .blog-header { display: none; }
        body { overflow: hidden; }
      }
    </style>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8302214774959598" crossorigin="anonymous"></script>
  </head>
  <body style="text-align: center; padding: 0; border: 0; margin: 0;">

    <div id="portrait-blocker">
      <span class="icon">&#x21BB;</span>
      <p class="label">Rotate your device to play</p>
    </div>

    <header class="blog-header">
      <a class="blog-header-title" href="/">Stick The <span>Landing</span></a>
      <a class="blog-back-btn" href="/"><i class="fas fa-arrow-left"></i> Back to App</a>
    </header>

    <canvas id="unity-canvas" width=1280 height=720 tabindex="-1" style="width: 1280px; height: 720px; background: #231F20"></canvas>

    <div style="max-width:1280px;margin:16px auto;padding:0 16px">
      <ins class="adsbygoogle" style="display:block"
           data-ad-client="ca-pub-8302214774959598"
           data-ad-slot="9070201653"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>

    <script src="Build/SecondTestBuild.loader.js"></script>
    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }

      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/SecondTestBuild.data.unityweb",
        frameworkUrl: "Build/SecondTestBuild.framework.js.unityweb",
        codeUrl: "Build/SecondTestBuild.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Stick The Landing",
        productName: "Stick It!",
        productVersion: "1.0",
        // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
        devicePixelRatio: 1, // Fix touch-coordinate mismatch on high-DPI mobile screens.
      }).then((unityInstance) => {
      }).catch((message) => {
        alert(message);
      });

      function tryLockLandscape() {
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(function() {});
        }
      }
      document.addEventListener('fullscreenchange', function() {
        if (document.fullscreenElement) tryLockLandscape();
      });
      document.addEventListener('touchstart', tryLockLandscape, { once: true });
    </script>
  </body>
</html>
